<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Личный планировщик" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F3F4F7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B0E17" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Folio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <title>Folio</title>
    <script>
      // Тема, выбранная вручную, применяется до отрисовки, чтобы экран не мигал.
      try {
        var t = localStorage.getItem('folio:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
    <style>
      html { background: #F3F4F7; }
      @media (prefers-color-scheme: dark) { html:not([data-theme='light']) { background: #0B0E17; } }
      html[data-theme='dark'] { background: #0B0E17; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
